<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biologie Klasse 10 – MC-Test</title>
<style>
  body{font-family:Arial,sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#f4f6f8;color:#222}
  h1{margin-bottom:5px}.subtitle{color:#555}
  .info,.question,.result{background:white;border-radius:12px;padding:18px;margin:16px 0;box-shadow:0 2px 8px #0001}
  .question h3{margin-top:0}.option{display:block;padding:8px;margin:5px 0;border-radius:7px}
  .option:hover{background:#f0f3f5}
  button{background:#222;color:white;border:0;border-radius:9px;padding:13px 20px;font-size:16px;cursor:pointer}
  button:hover{opacity:.85}
  #result{display:none}.correct{color:green}.wrong{color:#b00020}
  .bar{height:22px;background:#ddd;border-radius:10px;overflow:hidden}.fill{height:100%;background:#555}
</style>
</head>
<body>
<h1>Biologie Klasse 10 – Multiple-Choice-Test</h1>
<p class="subtitle">50 Fragen · jeweils genau eine Antwort ist richtig</p>

<div class="info">
  <p><strong>Name:</strong> <input id="name" type="text" style="padding:7px;width:250px"></p>
  <p>Bearbeite alle Fragen und klicke anschließend auf <strong>„Test auswerten“</strong>.</p>
</div>

<form id="quiz"></form>
<button type="button" onclick="evaluateQuiz()">Test auswerten</button>
<div id="result" class="result"></div>

<script>
const questions = [
["Welche Struktur besitzen sowohl Pflanzen- als auch Tierzellen?",["Zellwand","Chloroplasten","Zellmembran","große Zentralvakuole"],2],
["Was ist ein wesentliches Merkmal von Eukaryoten?",["Sie besitzen keinen Zellkern.","Ihre DNA liegt ausschließlich im Cytoplasma.","Sie besitzen membranumgrenzte Organellen.","Sie besitzen grundsätzlich eine Zellwand."],2],
["Welche Funktion hat der Zellkern?",["Speicherung und Schutz der DNA","Herstellung von ATP","Durchführung der Fotosynthese","Speicherung von Wasser"],0],
["Welche Struktur ist typisch für Pflanzenzellen und nicht für Tierzellen?",["Zellmembran","Cytoplasma","Zellwand","Zellkern"],2],
["Welche Aufgabe haben Plastiden wie Chloroplasten?",["Sie bauen Proteine ab.","Sie sind an der Fotosynthese beteiligt.","Sie speichern ausschließlich DNA.","Sie steuern die Mitose."],1],
["Was befindet sich im Cytoplasma einer Zelle?",["Nur die DNA","Die Zellwand","Zellflüssigkeit und verschiedene Zellstrukturen","Ausschließlich Proteine"],2],
["Warum kann man bei einer mikroskopischen Untersuchung von Elodea-Blattzellen Plastiden besonders gut erkennen?",["Weil sie besonders groß und farblos sind.","Weil sie Pigmente enthalten.","Weil sie außerhalb der Zelle liegen.","Weil sie aus DNA bestehen."],1],
["Wie wird der grundlegende Aufbau der Zellmembran beschrieben?",["Zellulose-Modell","Fluid-Mosaik-Modell","Doppelhelix-Modell","Schlüssel-Schloss-Modell"],1],
["Was bedeutet Diffusion?",["Gerichtete Bewegung von Teilchen von hoher zu niedriger Konzentration","Transport ausschließlich unter Energieverbrauch","Aufnahme großer Teilchen durch die Zelle","Herstellung neuer Moleküle"],0],
["Was ist Osmose?",["Bewegung von Proteinen durch eine Membran","Bewegung von Wasser durch eine selektiv permeable Membran","Transport von DNA in den Zellkern","Abbau von Glucose"],1],
["Eine Pflanzenzelle wird in eine stark konzentrierte Salzlösung gelegt. Was kann passieren?",["Die Zelle nimmt Wasser auf und platzt sofort.","Die Zelle verliert Wasser und plasmolysiert.","Die Zellwand löst sich auf.","Die DNA verlässt die Zelle."],1],
["Was bedeutet „selektiv permeabel“?",["Die Membran lässt alle Stoffe ungehindert passieren.","Die Membran lässt grundsätzlich keine Stoffe passieren.","Die Membran lässt bestimmte Stoffe passieren, andere nicht.","Die Membran besteht nur aus Proteinen."],2],
["Was bezeichnet Endocytose?",["Abgabe von Stoffen aus der Zelle","Aufnahme von Stoffen durch Einstülpung der Zellmembran","Bewegung von Wasser durch die Membran","Teilung einer Zelle"],1],
["Was geschieht bei der Exocytose?",["Stoffe werden mithilfe von Vesikeln aus der Zelle abgegeben.","Wasser diffundiert in die Zelle.","DNA wird verdoppelt.","Die Zellmembran wird vollständig abgebaut."],0],
["Welche Aussage beschreibt Enzyme am besten?",["Enzyme sind grundsätzlich Energieträger.","Enzyme wirken als Biokatalysatoren.","Enzyme bestehen ausschließlich aus DNA.","Enzyme werden bei jeder Reaktion vollständig verbraucht."],1],
["Warum können Enzyme chemische Reaktionen beschleunigen?",["Sie erhöhen die Aktivierungsenergie.","Sie senken die benötigte Aktivierungsenergie.","Sie erhöhen grundsätzlich die Temperatur.","Sie liefern immer Sauerstoff."],1],
["Welche Struktur eines Enzyms ist entscheidend für die Bindung des Substrats?",["Zellwand","Aktives Zentrum","Zellkern","Phospholipid-Doppelschicht"],1],
["Warum beeinflusst die Temperatur die Enzymaktivität?",["Temperatur verändert grundsätzlich die DNA-Menge.","Temperatur beeinflusst Bewegung und Struktur von Enzymen.","Temperatur verhindert jede chemische Reaktion.","Temperatur verändert die Anzahl der Zellkerne."],1],
["Was passiert häufig bei einer zu hohen Temperatur mit einem Enzym?",["Es kann denaturieren.","Es wird zu DNA.","Es verdoppelt sich.","Es wird dauerhaft aktiver."],0],
["Welcher Faktor kann die Aktivität eines Enzyms beeinflussen?",["pH-Wert","Zellwandfarbe","Augenfarbe des Organismus","Anzahl der Chromosomen eines anderen Organismus"],0],
["Was versteht man unter einer Enzymhemmung?",["Eine Erhöhung der Enzymaktivität ohne Grenze","Eine Verringerung der Enzymaktivität durch einen hemmenden Einfluss","Die Verdopplung des Enzyms","Die Herstellung eines neuen Zellkerns"],1],
["Bei einem Katalase-Versuch mit Wasserstoffperoxid entsteht Sauerstoff. Woran kann man diesen erkennen?",["An der Schaumbildung","An einer DNA-Doppelhelix","An einer Plasmolyse","An einer Zellteilung"],0],
["Was kann man mit einer Iod-Probe beim Stärkeabbau untersuchen?",["Ob DNA vorhanden ist","Ob Stärke vorhanden ist","Ob Sauerstoff vorhanden ist","Ob Zellmembranen vorhanden sind"],1],
["Warum kann die gleiche Reaktion bei Zellen als „kalte Verbrennung“ bezeichnet werden?",["Weil Zellen keine Energie benötigen.","Weil Enzyme Reaktionen unter vergleichsweise milden Bedingungen ermöglichen.","Weil Zellen grundsätzlich kalt sind.","Weil dabei kein Sauerstoff beteiligt sein kann."],1],
["Welche Aussage beschreibt den Zusammenhang zwischen Fotosynthese und Zellatmung richtig?",["Beide Prozesse sind völlig unabhängig voneinander.","Die Produkte der Fotosynthese können bei der Zellatmung genutzt werden.","Zellatmung findet ausschließlich in Pflanzen statt.","Fotosynthese verbraucht ATP und erzeugt ausschließlich CO₂."],1],
["Welches Molekül ist ein wichtiger Energieträger der Zelle?",["ATP","DNA","Zellulose","Stärke"],0],
["Was ist ein Produzent in einem Ökosystem?",["Ein Organismus, der ausschließlich andere Organismen frisst","Ein Organismus, der organische Stoffe selbst aufbauen kann","Ein Organismus ohne Energiebedarf","Ein Organismus, der keine Stoffe aufnimmt"],1],
["Welche Reihenfolge beschreibt den Energiefluss vereinfacht richtig?",["Konsument → Sonne → Produzent","Sonne → Produzent → Konsument","Produzent → Sonne → Konsument","Sonne → Konsument → Produzent"],1],
["Welche Stoffe stehen im Zusammenhang zwischen Fotosynthese und Zellatmung?",["CO₂ und O₂","DNA und RNA","Salz und Stärke","Eiweiß und Zellulose"],0],
["Was unterscheidet autotrophe und heterotrophe Organismen?",["Autotrophe Organismen können organische Stoffe aus anorganischen Ausgangsstoffen aufbauen.","Heterotrophe Organismen besitzen immer Chloroplasten.","Autotrophe Organismen benötigen keine Energie.","Heterotrophe Organismen betreiben immer Fotosynthese."],0],
["Welche Aufgabe hat die DNA?",["Sie speichert die genetische Information.","Sie transportiert ausschließlich Sauerstoff.","Sie bildet die Zellmembran.","Sie dient ausschließlich als Energieträger."],0],
["Welche Form besitzt die DNA grundsätzlich?",["Einzelstrang","Doppelhelix","Ring aus Proteinen","Kugelform"],1],
["Welche Basenpaarung ist in der DNA richtig?",["A–C und G–T","A–T und G–C","A–G und C–T","A–U und G–C"],1],
["Was bedeutet „semikonservativ“ bei der DNA-Replikation?",["Jede neue DNA besteht ausschließlich aus neuen Strängen.","Jede neue DNA enthält einen alten und einen neu gebildeten Strang.","DNA wird nur teilweise verdoppelt.","Nur eine Base wird kopiert."],1],
["Warum muss die DNA vor einer Zellteilung verdoppelt werden?",["Damit beide entstehenden Zellen genetische Information erhalten.","Damit die Zellmembran dicker wird.","Damit mehr ATP entsteht.","Damit die Zelle Wasser verliert."],0],
["Welche Funktion hat die Mitose?",["Bildung genetisch unterschiedlicher Keimzellen","Bildung genetisch weitgehend identischer Tochterzellen","Verdopplung der Zellmembran ohne Zellteilung","Herstellung von Enzymen"],1],
["Wie viele Zellteilungen finden bei der Meiose statt?",["Eine","Zwei","Drei","Keine"],1],
["Welches Ergebnis hat die Meiose typischerweise?",["Vier genetisch unterschiedliche Zellen","Zwei genetisch identische Körperzellen","Eine Zelle mit doppeltem Chromosomensatz","Vier genetisch identische Körperzellen"],0],
["Was ist Crossing-over?",["Austausch von DNA-Abschnitten zwischen homologen Chromosomen","Verdopplung der gesamten DNA","Teilung der Zellmembran","Aufnahme von Wasser"],0],
["Warum erhöht die Meiose die genetische Vielfalt?",["Unter anderem durch Rekombination","Weil alle Tochterzellen identisch sind","Weil keine DNA vorhanden ist","Weil die Zellmembran zerstört wird"],0],
["Welcher Prozess gehört zur Mitose und nicht ausschließlich zur Meiose?",["Bildung genetisch unterschiedlicher Keimzellen","Crossing-over","Bildung von Tochterzellen für Wachstum und Erneuerung","Rekombination homologer Chromosomen"],2],
["Was ist ein wesentlicher Unterschied zwischen Mitose und Meiose?",["Bei der Mitose entstehen normalerweise genetisch weitgehend identische Tochterzellen, bei der Meiose genetisch unterschiedliche Zellen.","Bei der Mitose gibt es keine DNA.","Bei der Meiose findet keine Zellteilung statt.","Mitose findet nur in Pflanzen statt."],0],
["Was untersucht die Mendelsche Genetik unter anderem?",["Vererbung von Merkmalen","Aufbau von Zellmembranen","Energiegewinnung durch ATP","Transport durch die Zellmembran"],0],
["Was ist eine monohybride Kreuzung?",["Eine Kreuzung, bei der zwei Merkmale betrachtet werden","Eine Kreuzung, bei der ein Merkmal betrachtet wird","Eine Kreuzung ohne genetische Unterschiede","Eine Kreuzung ausschließlich zwischen Pflanzen verschiedener Arten"],1],
["Was wird bei einer dihybriden Kreuzung betrachtet?",["Ein Merkmal","Zwei Merkmale","Zwei Zelltypen","Zwei Enzyme"],1],
["Wozu dient ein Punnett-Quadrat?",["Zur Vorhersage möglicher Kombinationen von Allelen bei einer Kreuzung","Zur Messung der Enzymaktivität","Zur Berechnung der Zellgröße","Zur Bestimmung der Membrandicke"],0],
["Was bedeutet „dominant“ bei einem Allel vereinfacht?",["Das Allel setzt sich bei einer heterozygoten Kombination im Phänotyp durch.","Das Allel kommt grundsätzlich häufiger vor.","Das Allel ist immer besser für den Organismus.","Das Allel wird immer zuerst vererbt."],0],
["Was bedeutet unvollständige Dominanz?",["Ein Allel setzt sich vollständig gegen das andere durch.","Der heterozygote Phänotyp liegt zwischen den beiden homozygoten Ausprägungen.","Beide Allele verschwinden.","Es wird kein Gen vererbt."],1],
["Wozu kann eine einfache χ²-Prüfung bei Kreuzungsversuchen dienen?",["Zum Vergleich beobachteter und erwarteter Häufigkeiten","Zur Bestimmung der DNA-Struktur","Zum Nachweis von Sauerstoff","Zur Messung des pH-Wertes eines Enzyms"],0],
["Warum haben Kreuzungsschemata Grenzen?",["Weil Vererbung immer vollständig zufällig und nicht berechenbar ist.","Weil nicht alle Vererbungsfälle durch einfache Mendelsche Modelle beschrieben werden können.","Weil Gene keine Rolle bei Merkmalen spielen.","Weil Punnett-Quadrate nur bei Zellen funktionieren."],1]
];

const quiz = document.getElementById("quiz");
questions.forEach((q,i)=>{
  const div=document.createElement("div");
  div.className="question";
  div.innerHTML=`<h3>${i+1}. ${q[0]}</h3>`+
    q[1].map((a,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}) ${a}</label>`).join("");
  quiz.appendChild(div);
});

function evaluateQuiz(){
  let score=0, unanswered=0;
  questions.forEach((q,i)=>{
    const selected=document.querySelector(`input[name="q${i}"]:checked`);
    if(!selected) unanswered++;
    else if(Number(selected.value)===q[2]) score++;
  });
  const percent=Math.round(score/50*100);
  let grade;
  if(score>=46) grade=1;
  else if(score>=41) grade=2;
  else if(score>=35) grade=3;
  else if(score>=29) grade=4;
  else if(score>=20) grade=5;
  else grade=6;

  const r=document.getElementById("result");
  r.style.display="block";
  r.innerHTML=`<h2>Auswertung</h2>
    <p><strong>${document.getElementById("name").value || "Teilnehmer/in"}</strong></p>
    <p><strong>${score} von 50 Punkten</strong> (${percent} %)</p>
    <p><strong>Note: ${grade}</strong></p>
    <div class="bar"><div class="fill" style="width:${percent}%"></div></div>
    ${unanswered?`<p class="wrong">${unanswered} Frage(n) wurden nicht beantwortet.</p>`:""}
    <p class="correct">Der Test wurde ausgewertet. Die richtigen Lösungen werden nicht einzeln angezeigt.</p>`;
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
</script>
</body>
</html>
